name: Dashboard checks

on:
  pull_request:
  push:
    branches:
      - claude/build-indicators-pipeline-QFtLk

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python regression dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Python regressions
        run: python -m unittest discover -s tests -v
      - name: JavaScript regressions
        run: node --test --test-isolation=none tests/test_*.js
      - name: Check JavaScript syntax
        run: |
          for source in app.js js/*.js scripts/*.js; do
            node --check "$source"
          done
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Build static artifact without changing source data
        run: |
          node scripts/build_static.js
          git diff --exit-code -- data
