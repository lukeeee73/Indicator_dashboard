name: Update FRED Indicators

# 주 1회 FRED API + Yahoo Finance 호출 → data/index.json + data/indicators/*.json
# + data/assets/*.json + data/stocks/*.json 갱신 → Supabase 전체 동기화 → 변경 시 자동 커밋.
# 매주 월요일 09:00 UTC (= 한국시간 월요일 18:00) 자동 + 수동 실행.
# 워치리스트나 수집 코드가 바뀌어 기본 브랜치에 머지되면 즉시 실행한다.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    branches: [claude/build-indicators-pipeline-QFtLk]
    paths:
      - "scripts/watchlist_data.py"
      - "scripts/fetch_fred.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py

      # 국채 입찰 결과(응찰률·낙찰 배분) — TreasuryDirect, API 키 불필요.
      # fetch_fred.py 가 data/indicators/ 를 정리하고 index.json 을 새로 쓰므로
      # 반드시 그 다음에 실행해야 한다.
      - name: Fetch Treasury auction results
        continue-on-error: true
        run: python scripts/fetch_auctions.py

      - name: Rebuild principles timeline
        run: python scripts/build_principles.py

      # ── 위키 지식 그래프 (대시보드 '위키' 탭) ──────────────────
      # luke_wiki 가 공개면 기본 토큰으로 바로 체크아웃되고,
      # 비공개면 WIKI_REPO_TOKEN 시크릿(Contents: Read PAT)이 필요하다.
      # 어느 쪽도 안 되면 이 단계만 건너뛰고 지표 갱신은 계속 진행.
      - name: Checkout luke_wiki
        id: wiki_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: lukeeee73/luke_wiki
          token: ${{ secrets.WIKI_REPO_TOKEN || github.token }}
          path: .luke_wiki_src
          fetch-depth: 0

      - name: Build wiki knowledge graph
        if: steps.wiki_checkout.outcome == 'success'
        run: python scripts/build_wiki_graph.py --vault .luke_wiki_src --out data/wiki/graph.json --repo lukeeee73/luke_wiki

      # 모든 data/ 산출물이 완성된 뒤 시계열·문서·뉴스를 한 번에 반영한다.
      - name: Sync all dashboard data to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_LOOKBACK_DAYS: "120"
        run: python scripts/sync_supabase.py

      - name: Commit & push if data/ changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No changes under data/ — skipping commit."
          else
            git add data/
            git commit -m "chore: update indicators ($(date -u +%Y-%m-%d))"
            git push
          fi
