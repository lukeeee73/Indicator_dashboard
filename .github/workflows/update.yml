name: Update FRED Indicators

# 주 1회 FRED API 호출 → data/index.json + data/indicators/*.json + data/assets/*.json 갱신
# → 변경 시 자동 커밋. 매주 월요일 09:00 UTC (= 한국시간 월요일 18:00) 자동 + 수동 실행.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# GITHUB_TOKEN 에 푸시 권한 부여 (자동 커밋을 위해 필요)
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py

      - name: Commit & push if data/ changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data/ 디렉토리 전체의 변경 유무를 exit code 로 판단
          if git diff --quiet -- data/; then
            echo "No changes under data/ — skipping commit."
          else
            git add data/
            git commit -m "chore: update indicators ($(date -u +%Y-%m-%d))"
            git push
          fi
